name: Docker

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build compose images
        run: docker compose build worker test

      - name: Build runtime worker image
        run: docker build --target runtime -f docker/backend.Dockerfile -t werewolf-agent-worker:runtime .

      - name: Run backend checks in container
        run: docker compose --profile tools run --rm test

      - name: Stop containers
        if: always()
        run: docker compose down -v
