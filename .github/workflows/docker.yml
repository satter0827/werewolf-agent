name: Docker

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validation:
    name: Application validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low

      - name: Validate generated API client
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code -- src/generated/api.ts

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build compose images
        run: docker compose build api worker frontend streamlit test e2e

      - name: Build runtime worker image
        run: docker build --target runtime -f docker/backend.Dockerfile -t werewolf-agent-worker:runtime .

      - name: Run backend checks in container
        run: docker compose --profile test run --rm --no-deps test

      - name: Stop containers
        if: always()
        run: docker compose down -v
