name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  QUALITY_RUNTIME_IMAGE: werewolf-agent-quality-runtime:latest

jobs:
  check:
    if: github.event_name == 'pull_request'
    name: Check / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv run --no-project python -m scripts.environment setup check
      - run: uv run --no-sync python -m scripts.quality check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-check-python-${{ matrix.python-version }}
          path: |
            .werewolf-agent/quality
            .werewolf-agent/build
          if-no-files-found: warn
          include-hidden-files: true

  release:
    if: github.event_name == 'push'
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: supabase/setup-cli@v1
        with:
          version: 2.104.0
      - run: uv run --no-project python -m scripts.environment setup release
      - run: uv run --no-sync python -m scripts.quality release
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-release
          path: |
            .werewolf-agent/quality
            .werewolf-agent/build
          if-no-files-found: warn
          include-hidden-files: true
      - if: always()
        run: supabase stop --no-backup

  deep:
    if: github.event_name == 'workflow_dispatch'
    name: Deep
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: supabase/setup-cli@v1
        with:
          version: 2.104.0
      - run: uv run --no-project python -m scripts.environment setup deep
      - run: uv run --no-sync python -m scripts.quality deep --confirm-deep
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-deep
          path: |
            .werewolf-agent/quality
            .werewolf-agent/build
          if-no-files-found: warn
          include-hidden-files: true
      - if: always()
        run: supabase stop --no-backup
