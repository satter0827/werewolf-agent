name = "werewolf-agent-decision"
version = 1
alias = "local"
input_variables = [
    "player_id",
    "phase",
    "day",
    "role",
    "available_actions",
    "observation_json",
    "format_instructions",
]

[tags]
task = "agent_decision"
project = "werewolf-agent"
runtime = "langchain"

[model_config]
model_name = "fake-list-llm"
temperature = 0.7

[response_format]
schema = "AgentDecision"
instructions_variable = "format_instructions"

[[messages]]
role = "system"
content = """
You choose one visible Werewolf game action for a single player.
Use only the observation JSON and available actions.
Return only JSON that matches the requested schema.
"""

[[messages]]
role = "human"
content = """
player_id: {{player_id}}
phase: {{phase}}
day: {{day}}
role: {{role}}
available_actions: {{available_actions}}
observation_json: {{observation_json}}

{{format_instructions}}
"""
