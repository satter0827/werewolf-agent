app_name = "werewolf-agent"
api_service_name = "werewolf-agent-api"

generated_dir = ".werewolf-agent"
sqlite_path = ".werewolf-agent/db/db.sqlite3"

llm_provider = "fake"
model = "fake-list-llm"
llm_timeout_seconds = 30.0
llm_max_retries = 2
llm_temperature = 0.7
llm_prompt_file = ""
llm_fake_responses_file = ""
llm_agents_file = ""

log_level = "INFO"
log_output = "file"
log_dir = ".werewolf-agent/logs"
log_file_name = "werewolf-agent.jsonl"
log_retention_days = 14
log_third_party_level = "WARNING"

cli_api_url = "http://127.0.0.1:8000/api/v1"
cli_http_timeout_seconds = 10.0
cli_max_steps = 64
cli_poll_interval_seconds = 0.0
cli_event_limit = 100
cli_output_format = "table"

streamlit_api_url = ""
streamlit_http_timeout_seconds = 10.0
streamlit_refresh_interval_seconds = 5.0
streamlit_event_limit = 100
streamlit_turn_limit = 100
streamlit_run_limit = 20
streamlit_max_auto_steps = 64
streamlit_auto_advance_after_action = true
streamlit_initial_sidebar_state = "expanded"
streamlit_language = "ja"
streamlit_save_file = ".werewolf-agent/streamlit/saves.json"
streamlit_default_seed = 1
streamlit_default_human_player_id = "player-1"
streamlit_message_max_chars = 200
streamlit_page_title = "Werewolf Agent"
streamlit_service_name = "werewolf-agent-streamlit"

api_title = "Werewolf Agent API"
api_version = "0.1.0"
api_debug = false
api_cors_allowed_origins = ""
api_cors_allowed_methods = "GET,POST"
api_cors_allowed_headers = "*"

game_min_players = 5
game_max_players = 8
game_default_player_count = 6
game_supported_agent_type = "llm"
game_supported_agent_name = "LLM Agent"
game_default_ruleset_id = "default"
game_default_ruleset_name = "MVP Default"
game_rules_file = ""
game_roles_file = ""
game_advance_until_input_max_steps = 64
game_ruleset_description_template = "{min_players}〜{max_players}人向けの最小同期 API ルールセットです。"
game_role_names = "villager:村人,werewolf:人狼,seer:占い師,knight:騎士"
game_phase_names = "night:夜,day_discussion:昼チャット,voting:投票,finished:終了"
