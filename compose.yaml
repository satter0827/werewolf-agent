x-runtime-environment: &runtime-environment
  WEREWOLF_API_DEBUG: ${WEREWOLF_API_DEBUG:-true}
  WEREWOLF_CORS_ALLOWED_ORIGINS: ${WEREWOLF_CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  WEREWOLF_SUPABASE_URL: ${WEREWOLF_SUPABASE_URL:-}
  WEREWOLF_SUPABASE_PUBLISHABLE_KEY: ${WEREWOLF_SUPABASE_PUBLISHABLE_KEY:-}
  WEREWOLF_SUPABASE_DB_DSN: ${WEREWOLF_SUPABASE_DB_DSN:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

x-backend-build: &backend-build
  context: .
  dockerfile: docker/backend.Dockerfile
  target: dev

x-backend-volumes: &backend-volumes
  - .:/app

services:
  api:
    build: *backend-build
    init: true
    environment:
      <<: *runtime-environment
      WEREWOLF_LOG_FILE_NAME: api.jsonl
    volumes: *backend-volumes
    ports:
      - "8000:8000"
    command: uvicorn werewolf_agent.interface.api.app:create_app --factory --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: *backend-build
    profiles: ["worker"]
    init: true
    environment:
      <<: *runtime-environment
      WEREWOLF_LOG_FILE_NAME: worker.jsonl
    volumes: *backend-volumes
    command: werewolf-agent-worker run

  test:
    build: *backend-build
    profiles: ["tools"]
    environment:
      <<: *runtime-environment
      WEREWOLF_LOG_FILE_NAME: test.jsonl
    volumes: *backend-volumes
    command: pytest
