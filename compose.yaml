x-api-environment: &api-environment
  WEREWOLF_LLM_PROVIDER: ${WEREWOLF_LLM_PROVIDER:-fake_llm}
  WEREWOLF_MODEL: ${WEREWOLF_MODEL:-fake-llm-local}
  WEREWOLF_LLM_TIMEOUT_SECONDS: ${WEREWOLF_LLM_TIMEOUT_SECONDS:-30}
  WEREWOLF_LLM_MAX_RETRIES: ${WEREWOLF_LLM_MAX_RETRIES:-2}
  WEREWOLF_LLM_TEMPERATURE: ${WEREWOLF_LLM_TEMPERATURE:-0.7}
  WEREWOLF_FAKE_LLM_STRATEGY: ${WEREWOLF_FAKE_LLM_STRATEGY:-seeded}
  WEREWOLF_FAKE_LLM_RANDOMNESS: ${WEREWOLF_FAKE_LLM_RANDOMNESS:-0.7}
  WEREWOLF_FAKE_LLM_SPEECH_TEMPLATES: ${WEREWOLF_FAKE_LLM_SPEECH_TEMPLATES:-I want to hear more from {target_name}.|{target_name}'s vote history looks worth checking.|I will compare today's claims before voting.}
  WEREWOLF_LOG_LEVEL: ${WEREWOLF_LOG_LEVEL:-INFO}
  WEREWOLF_LOG_OUTPUT: ${WEREWOLF_LOG_OUTPUT:-file}
  WEREWOLF_LOG_DIR: ${WEREWOLF_LOG_DIR:-.werewolf-agent/logs}
  WEREWOLF_LOG_FILE_NAME: ${WEREWOLF_LOG_FILE_NAME:-werewolf-agent.jsonl}
  WEREWOLF_LOG_RETENTION_DAYS: ${WEREWOLF_LOG_RETENTION_DAYS:-14}
  WEREWOLF_LOG_THIRD_PARTY_LEVEL: ${WEREWOLF_LOG_THIRD_PARTY_LEVEL:-WARNING}
  WEREWOLF_GAME_MIN_PLAYERS: ${WEREWOLF_GAME_MIN_PLAYERS:-5}
  WEREWOLF_GAME_MAX_PLAYERS: ${WEREWOLF_GAME_MAX_PLAYERS:-8}
  WEREWOLF_GAME_DEFAULT_PLAYER_COUNT: ${WEREWOLF_GAME_DEFAULT_PLAYER_COUNT:-6}
  WEREWOLF_GAME_SUPPORTED_AGENT_TYPE: ${WEREWOLF_GAME_SUPPORTED_AGENT_TYPE:-llm}
  WEREWOLF_GAME_SUPPORTED_AGENT_NAME: ${WEREWOLF_GAME_SUPPORTED_AGENT_NAME:-LLM Agent}
  WEREWOLF_GAME_DEFAULT_RULESET_ID: ${WEREWOLF_GAME_DEFAULT_RULESET_ID:-default}
  WEREWOLF_GAME_DEFAULT_RULESET_NAME: ${WEREWOLF_GAME_DEFAULT_RULESET_NAME:-MVP Default}
  WEREWOLF_GAME_RULESET_DESCRIPTION_TEMPLATE: ${WEREWOLF_GAME_RULESET_DESCRIPTION_TEMPLATE:-{min_players}〜{max_players}人向けの最小同期 API ルールセットです。}
  WEREWOLF_GAME_ROLE_NAMES: ${WEREWOLF_GAME_ROLE_NAMES:-villager:村人,werewolf:人狼,seer:占い師,knight:騎士}
  WEREWOLF_GAME_PHASE_NAMES: ${WEREWOLF_GAME_PHASE_NAMES:-night:夜,day_discussion:昼チャット,voting:投票,finished:終了}
  WEREWOLF_API_TITLE: ${WEREWOLF_API_TITLE:-Werewolf Agent API}
  WEREWOLF_API_VERSION: ${WEREWOLF_API_VERSION:-0.1.0}
  WEREWOLF_API_DEBUG: ${WEREWOLF_API_DEBUG:-true}
  WEREWOLF_CORS_ALLOWED_ORIGINS: ${WEREWOLF_CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  WEREWOLF_CORS_ALLOWED_METHODS: ${WEREWOLF_CORS_ALLOWED_METHODS:-GET,POST}
  WEREWOLF_CORS_ALLOWED_HEADERS: ${WEREWOLF_CORS_ALLOWED_HEADERS:-*}
  WEREWOLF_SQLITE_PATH: /data/db.sqlite3
  WEREWOLF_DATABASE_URL: ${WEREWOLF_DATABASE_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

x-backend-build: &backend-build
  context: .
  dockerfile: docker/backend.Dockerfile
  target: dev

x-backend-volumes: &backend-volumes
  - .:/app
  - werewolf-sqlite:/data

services:
  api:
    build: *backend-build
    init: true
    environment: *api-environment
    volumes: *backend-volumes
    ports:
      - "8000:8000"
    command: uvicorn werewolf_agent.interface.api.app:create_app --factory --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build: *backend-build
    profiles: ["tools"]
    environment: *api-environment
    volumes: *backend-volumes
    command: alembic upgrade head

  test:
    build: *backend-build
    profiles: ["tools"]
    environment: *api-environment
    volumes: *backend-volumes
    command: pytest

volumes:
  werewolf-sqlite:
