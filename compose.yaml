x-api-environment: &api-environment
  WEREWOLF_LLM_PROVIDER: ${WEREWOLF_LLM_PROVIDER:-dummy}
  WEREWOLF_MODEL: ${WEREWOLF_MODEL:-dummy-local}
  WEREWOLF_LOG_LEVEL: ${WEREWOLF_LOG_LEVEL:-INFO}
  WEREWOLF_LOG_FORMAT: ${WEREWOLF_LOG_FORMAT:-json}
  WEREWOLF_LOG_OUTPUT: ${WEREWOLF_LOG_OUTPUT:-stderr}
  WEREWOLF_API_DEBUG: ${WEREWOLF_API_DEBUG:-true}
  WEREWOLF_CORS_ALLOWED_ORIGINS: ${WEREWOLF_CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  WEREWOLF_SQLITE_PATH: /data/db.sqlite3
  WEREWOLF_DATABASE_URL: ${WEREWOLF_DATABASE_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

x-backend-build: &backend-build
  context: .
  dockerfile: docker/backend.Dockerfile
  target: dev

x-backend-volumes: &backend-volumes
  - .:/app
  - werewolf-sqlite:/data

services:
  api:
    build: *backend-build
    init: true
    environment: *api-environment
    volumes: *backend-volumes
    ports:
      - "8000:8000"
    command: uvicorn werewolf_agent.interface.entrypoint.api.app:create_app --factory --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build: *backend-build
    profiles: ["tools"]
    environment: *api-environment
    volumes: *backend-volumes
    command: alembic upgrade head

  test:
    build: *backend-build
    profiles: ["tools"]
    environment: *api-environment
    volumes: *backend-volumes
    command: pytest

volumes:
  werewolf-sqlite:
