[project]
name = "werewolf-agent"
version = "0.1.0"
description = "LLM agents play and observe a deterministic Werewolf game engine."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [
    { name = "werewolf-agent contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "rich>=13.9,<15",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
api = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "sse-starlette>=2.2,<4",
    "uvicorn[standard]>=0.34,<1",
]
llm = [
    "langchain>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "openai>=1.59,<2",
]

[project.scripts]
werewolf-agent = "werewolf_agent.interface.cui.app:app"

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/werewolf_agent"]

[tool.hatch.build.targets.sdist]
only-include = [
    ".env.example",
    "alembic.ini",
    "LICENSE",
    "README.md",
    "backend/src",
    "compose.postgres.yaml",
    "compose.yaml",
    "docker",
    "docs",
    "pyproject.toml",
    "tests",
]
exclude = [
    ".gitignore",
]

[tool.pytest.ini_options]
addopts = "-q"
cache_dir = ".werewolf-agent/cache/pytest"
pythonpath = ["backend/src"]
testpaths = ["tests"]
tmp_path_retention_policy = "none"

[tool.ruff]
cache-dir = ".ruff_cache"
line-length = 100
src = ["backend/src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
cache_dir = ".werewolf-agent/cache/mypy"
check_untyped_defs = true
files = ["backend/src"]
mypy_path = "backend/src"
python_version = "3.11"
show_error_codes = true
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "werewolf_agent.interface.api.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "werewolf_agent.interface.application.*"
ignore_errors = true

[tool.coverage.run]
data_file = ".werewolf-agent/cache/coverage/.coverage"
