[project]
name = "werewolf-agent"
version = "0.1.0"
description = "LLM agents play and observe a deterministic Werewolf game engine."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [
    { name = "werewolf-agent contributors" },
]
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "rich>=13.9,<15",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
api = [
    "dj-database-url>=2.3,<3",
    "django>=5.1,<6",
    "djangorestframework>=3.15,<4",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.8,<7",
]
llm = [
    "langchain>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "openai>=1.59,<2",
]

[project.scripts]
werewolf-agent = "werewolf_agent.interfaces.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/werewolf_agent"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["backend/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["backend/src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
check_untyped_defs = true
files = ["backend/src"]
mypy_path = "backend/src"
python_version = "3.11"
show_error_codes = true
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "werewolf_agent.interfaces.api.*"
ignore_errors = true
