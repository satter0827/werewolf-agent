[project]
name = "werewolf-agent"
dynamic = ["version"]
description = "Deterministic headless Werewolf SDK for agent experiments and applications."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
keywords = [
    "ai-agents",
    "llm",
    "multi-agent-systems",
    "social-deduction",
    "werewolf",
]
authors = [
    { name = "werewolf-agent contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/satter0827/werewolf-agent"
Documentation = "https://github.com/satter0827/werewolf-agent/tree/main/docs"
Repository = "https://github.com/satter0827/werewolf-agent"
Issues = "https://github.com/satter0827/werewolf-agent/issues"

[project.optional-dependencies]
application = [
    "pydantic>=2.10,<3",
    "toml>=0.10,<1",
]
api = [
    "fastapi>=0.115,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.14.2,<3",
    "pyjwt[crypto]>=2.13,<3",
    "python-dotenv>=1.0,<2",
    "structlog>=24.4,<26",
    "toml>=0.10,<1",
    "uvicorn[standard]>=0.34,<1",
]
cli = [
    "httpx>=0.28,<1",
    "keyring>=25.7,<26",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.14.2,<3",
    "platformdirs>=4.3,<5",
    "python-dotenv>=1.0,<2",
    "rich>=13.9,<15",
    "structlog>=24.4,<26",
    "supabase-auth>=2.31,<3",
    "toml>=0.10,<1",
    "typer>=0.15,<1",
]
llm = [
    "langchain-core>=1.4,<2",
    "langchain-openai>=1.3,<2",
    "pydantic>=2.10,<3",
]
streamlit = [
    "httpx>=0.28,<1",
    "keyring>=25.7,<26",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.14.2,<3",
    "platformdirs>=4.3,<5",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.48,<2",
    "structlog>=24.4,<26",
    "supabase-auth>=2.31,<3",
    "toml>=0.10,<1",
]
worker = [
    "httpx>=0.28,<1",
    "langchain-core>=1.4,<2",
    "langchain-openai>=1.3,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.14.2,<3",
    "python-dotenv>=1.0,<2",
    "structlog>=24.4,<26",
    "toml>=0.10,<1",
    "typer>=0.15,<1",
]

[project.scripts]
werewolf-agent = "werewolf_agent._entrypoints:cli"
werewolf-agent-api = "werewolf_agent._entrypoints:api"
werewolf-agent-worker = "werewolf_agent._entrypoints:worker"

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8,<0.2",
    "build>=1.2,<2",
    "hatchling>=1.27,<2",
    "hypothesis>=6.130,<7",
    "jsonschema>=4.23,<5",
    "ipykernel>=6.29,<8",
    "mypy>=1.14,<2",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "packaging>=25,<27",
    "pillow>=11.1,<13",
    "playwright>=1.60,<2",
    "psutil>=7,<8",
    "pytest-benchmark>=5,<6",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "pytest-html>=4.1,<5",
    "pytest-json-report>=1.5,<2",
    "pytest-playwright>=0.7,<1",
    "pytest-xdist>=3.6,<4",
    "respx>=0.22,<1",
    "ruff>=0.9,<0.15",
    "schemathesis>=4,<5",
]
docs = [
    "furo>=2024.8.6,<2026",
    "myst-parser>=4,<5",
    "sphinx>=8,<9",
    "sphinx-copybutton>=0.5.2,<1",
    "sphinx-design>=0.6.1,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/werewolf_agent/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/werewolf_agent"]

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "src",
    "pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -p no:cacheprovider --benchmark-storage=file://.werewolf-agent/cache/pytest-benchmark"
markers = [
    "unit: 外部serviceを使わないunit test",
    "integration: 複数moduleを接続するintegration test",
    "supabase: local Supabaseを使うintegration test",
    "monkey: seed固定の状態遷移探索",
    "benchmark: 性能退行の検出",
    "deep: 明示確認が必要な拡張test",
    "serial: 共有資源を使う直列test",
]
pythonpath = [".", "src"]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"

[tool.werewolf-quality]
benchmark_min_rounds = 5
default_jobs = 2
max_jobs = 4
failure_runs_per_selector = 2
failure_run_max_mib = 100
docker_builder_cache_max_gib = 8

[tool.werewolf-artifacts]
operation_runs_per_kind = 10
operation_max_mib = 50
operation_failure_output_max_chars = 20000
review_runs_per_kind = 3
review_max_mib = 100
review_private_retention_days = 7

[tool.werewolf-quality.hypothesis]
focus_examples = 10
check_examples = 30
release_examples = 30
deep_examples = 100
focus_steps = 20
check_steps = 40
release_steps = 40
deep_steps = 100

[tool.werewolf-quality.timeouts]
focus = 120
check = 300
release = 900
deep = 1200

[tool.ruff]
cache-dir = ".werewolf-agent/cache/ruff"
line-length = 100
src = ["src", "scripts", "tests", "notebooks"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
cache_dir = ".werewolf-agent/cache/mypy"
check_untyped_defs = true
files = ["src", "scripts", "notebooks/werewolf_demo", ".codex/hooks"]
mypy_path = "src"
python_version = "3.11"
show_error_codes = true
strict = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
data_file = ".werewolf-agent/cache/coverage/.coverage"
source = ["werewolf_agent"]

[tool.coverage.report]
precision = 0
show_missing = true
skip_covered = true
