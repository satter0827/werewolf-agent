[project]
name = "werewolf-agent"
version = "0.1.0"
description = "LLM agents play and observe a deterministic Werewolf game engine."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [
    { name = "werewolf-agent contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<1",
    "langchain-core>=0.3,<0.4",
    "langgraph>=1.0,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "rich>=13.9,<15",
    "structlog>=24.4,<26",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "pyjwt[crypto]>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.34,<1",
]
llm = [
    "langchain-openai>=0.3,<0.4",
    "openai>=1.59,<2",
]
streamlit = [
    "streamlit>=1.41,<2",
]
worker = [
    "langchain-openai>=0.3,<0.4",
    "openai>=1.59,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
werewolf-agent = "werewolf_agent.clients.cli.app:app"
werewolf-agent-api = "werewolf_agent.api.app:run"
werewolf-agent-worker = "werewolf_agent.worker.app:app"

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hatchling>=1.27,<2",
    "jsonschema>=4.23,<5",
    "mypy>=1.14,<2",
    "pytest-benchmark>=5,<6",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.9,<0.15",
]
docs = [
    "myst-parser>=4,<5",
    "sphinx>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/werewolf_agent"]

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "src",
    "pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -p no:cacheprovider --benchmark-storage=file://.werewolf-agent/quality/manual/benchmark"
markers = [
    "unit: 外部serviceを使わないunit test",
    "integration: local integration test",
    "monkey: seed固定の状態遷移探索",
    "benchmark: 性能退行の検出",
    "deep: 明示確認が必要な拡張test",
    "serial: 共有資源を使う直列test",
]
pythonpath = [".", "src"]
testpaths = ["tests"]
tmp_path_retention_policy = "none"

[tool.werewolf-quality]
benchmark_max_mean_ms = 10
benchmark_min_rounds = 5
branch_coverage_fail_under = 48
max_jobs = 4
failure_runs_per_selector = 3
failure_run_max_mib = 100

[tool.werewolf-quality.timeouts]
quick = 60
check = 180
release = 900
deep = 1200

[tool.ruff]
cache-dir = ".werewolf-agent/cache/ruff"
line-length = 100
src = ["src", "scripts", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
cache_dir = ".werewolf-agent/cache/mypy"
check_untyped_defs = true
files = ["src", "scripts"]
mypy_path = "src"
python_version = "3.11"
show_error_codes = true
strict = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
data_file = ".werewolf-agent/coverage/.coverage"
source = ["werewolf_agent"]

[tool.coverage.report]
fail_under = 74
precision = 0
show_missing = true
skip_covered = true
