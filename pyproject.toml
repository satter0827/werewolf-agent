[project]
name = "werewolf-agent"
version = "0.1.0"
description = "LLM agents play and observe a deterministic Werewolf game engine."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [
    { name = "werewolf-agent contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<1",
    "langchain-core>=0.3,<0.4",
    "langgraph>=1.0,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "rich>=13.9,<15",
    "structlog>=24.4,<26",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "pyjwt[crypto]>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.34,<1",
]
llm = [
    "langchain-openai>=0.3,<0.4",
    "openai>=1.59,<2",
]
streamlit = [
    "streamlit>=1.41,<2",
]
worker = [
    "langchain-openai>=0.3,<0.4",
    "openai>=1.59,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
werewolf-agent = "werewolf_agent.interfaces.cli.app:app"
werewolf-agent-api = "werewolf_agent.api.app:run"
werewolf-agent-worker = "werewolf_agent.interfaces.worker.app:app"

[dependency-groups]
dev = [
    "import-linter>=2.1,<3",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<0.15",
]
docs = [
    "myst-parser>=4,<5",
    "sphinx>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/werewolf_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/werewolf_agent/resources/settings/defaults.toml" = "werewolf_agent/resources/settings/defaults.toml"
"src/werewolf_agent/resources/game/rules.toml" = "werewolf_agent/resources/game/rules.toml"
"src/werewolf_agent/resources/game/roles.toml" = "werewolf_agent/resources/game/roles.toml"
"src/werewolf_agent/resources/game/abilities.toml" = "werewolf_agent/resources/game/abilities.toml"
"src/werewolf_agent/resources/presentation/catalog.toml" = "werewolf_agent/resources/presentation/catalog.toml"
"src/werewolf_agent/resources/llm/players.toml" = "werewolf_agent/resources/llm/players.toml"
"src/werewolf_agent/resources/prompts/agent_decision.toml" = "werewolf_agent/resources/prompts/agent_decision.toml"
"src/werewolf_agent/resources/llm/fake_responses.toml" = "werewolf_agent/resources/llm/fake_responses.toml"
"src/werewolf_agent/resources/llm/decision_graphs.toml" = "werewolf_agent/resources/llm/decision_graphs.toml"
"src/werewolf_agent/resources/streamlit/i18n.toml" = "werewolf_agent/resources/streamlit/i18n.toml"
"src/werewolf_agent/resources/streamlit/default.css" = "werewolf_agent/resources/streamlit/default.css"
"src/werewolf_agent/resources/streamlit/screens.toml" = "werewolf_agent/resources/streamlit/screens.toml"

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "README.md",
    "src",
    "pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
cache_dir = ".werewolf-agent/cache/pytest"
pythonpath = ["src"]
testpaths = ["tests"]
tmp_path_retention_policy = "none"

[tool.importlinter]
root_packages = ["werewolf_agent"]

[[tool.importlinter.contracts]]
name = "domain is independent"
type = "forbidden"
source_modules = ["werewolf_agent.domain"]
forbidden_modules = [
    "werewolf_agent.adapters",
    "werewolf_agent.agents",
    "werewolf_agent.api",
    "werewolf_agent.configuration",
    "werewolf_agent.contracts",
    "werewolf_agent.interfaces",
    "werewolf_agent.observability",
    "werewolf_agent.security",
    "werewolf_agent.usecase",
]

[[tool.importlinter.contracts]]
name = "usecase avoids infrastructure and delivery layers"
type = "forbidden"
source_modules = ["werewolf_agent.usecase"]
allow_indirect_imports = true
forbidden_modules = [
    "werewolf_agent.adapters",
    "werewolf_agent.agents",
    "werewolf_agent.api",
    "werewolf_agent.interfaces",
    "werewolf_agent.observability",
    "werewolf_agent.security",
]

[[tool.importlinter.contracts]]
name = "interfaces use no game internals"
type = "forbidden"
source_modules = [
    "werewolf_agent.interfaces.cli",
    "werewolf_agent.interfaces.streamlit",
]
forbidden_modules = [
    "werewolf_agent.domain",
    "werewolf_agent.usecase",
    "werewolf_agent.adapters.supabase.repository",
    "werewolf_agent.adapters.supabase.operations",
]

[tool.ruff]
cache-dir = ".werewolf-agent/cache/ruff"
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
cache_dir = ".werewolf-agent/cache/mypy"
check_untyped_defs = true
files = ["src"]
mypy_path = "src"
python_version = "3.11"
show_error_codes = true
strict = true
warn_unused_ignores = true

[tool.coverage.run]
data_file = ".werewolf-agent/coverage/.coverage"
