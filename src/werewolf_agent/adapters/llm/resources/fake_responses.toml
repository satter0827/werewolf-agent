name = "werewolf-agent-fake-decisions"
version = 2
alias = "local"

[tags]
task = "agent_decision"
provider = "fake-list-chat-model"

[templates]
speech_opening_question = [
'''{"type":"speech","message":"$subject_nameさんは、現時点で誰をどの公開情報から疑っていますか。"}''',
]
speech_opening_evidence = [
'''{"type":"speech","message":"$evidence_actor_nameさんの公開発言を踏まえ、$subject_nameさんの判断根拠を確認したいです。"}''',
]
speech_response = [
'''{"type":"speech","message":"$reference_actor_nameさんの発言では、$subject_nameさんを判断する根拠がまだ弱く見えます。どの公開事実を重視しましたか。"}''',
]
vote = [
'''{"type":"vote","target_id":"$target_id","reason":"$evidence_actor_nameさんの公開発言を踏まえ、$target_nameさんの説明が最も不足していると判断したため"}''',
]
use_ability = [
'''{"type":"use_ability","target_id":"$target_id"}''',
]
pass = [
'''{"type":"pass"}''',
]
