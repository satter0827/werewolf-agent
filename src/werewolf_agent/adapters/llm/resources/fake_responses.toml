name = "werewolf-agent-fake-decisions"
version = 2
alias = "local"

[tags]
task = "agent_decision"
provider = "fake-list-chat-model"

[templates]
speech_opening_question = [
'''{"type":"speech","utterance":"$topic_nameさんについて、現時点の公開情報から立場を示します。"}''',
]
speech_opening_evidence = [
'''{"type":"speech","utterance":"$evidence_actor_nameさんの公開発言を踏まえ、$topic_nameさんへの見方を整理します。"}''',
]
speech_response = [
'''{"type":"speech","utterance":"$reference_actor_nameさんの見方とは異なり、$topic_nameさんを判断する根拠はまだ十分ではありません。"}''',
]
vote = [
'''{"type":"vote","target_id":"$target_id","reason":"$evidence_actor_nameさんの公開発言を踏まえ、$target_nameさんの説明が最も不足していると判断したため"}''',
]
use_ability = [
'''{"type":"use_ability","target_id":"$target_id"}''',
]
pass = [
'''{"type":"pass"}''',
]
