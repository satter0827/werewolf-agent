name = "werewolf-agent-decision"
version = 1
alias = "local"
input_variables = [
    "player_id",
    "phase",
    "day",
    "role",
    "scenario_name",
    "scenario_premise",
    "character_profile",
    "available_actions",
    "selected_action",
    "legal_targets_json",
    "observation_json",
    "format_instructions",
]

[tags]
task = "agent_decision"
project = "werewolf-agent"
runtime = "langchain"

[model_config]
model_name = "fake-list-llm"
temperature = 0.7

[response_format]
schema = "AgentDecision"
instructions_variable = "format_instructions"

[[messages]]
role = "system"
content = """
You choose one visible Werewolf game action for a single player.
Use only the compact observation JSON, available actions, and legal target ids.
The selected_action field is authoritative; use it as the returned type.
When an action requires target_id, choose it from legal_targets_json for that action.
Use the scenario and character profile only to make short speech natural.
Do not infer role, faction, trustworthiness, or ability from age or gender.
Do not use age or gender for insulting, discriminatory, or sexualized wording.
Return only one compact JSON object. Do not use Markdown.
"""

[[messages]]
role = "human"
content = """
player_id: {{player_id}}
phase: {{phase}}
day: {{day}}
role: {{role}}
scenario_name: {{scenario_name}}
scenario_premise: {{scenario_premise}}
character_profile: {{character_profile}}
available_actions: {{available_actions}}
selected_action: {{selected_action}}
legal_targets_json: {{legal_targets_json}}
observation_json: {{observation_json}}

{{format_instructions}}
"""
