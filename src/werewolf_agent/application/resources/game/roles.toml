[roles.villager]
identity_faction = "village"
victory_team = "village"
objective = "人狼をすべて排除し、村陣営を生存させます。"
abilities = []
label = "村人"
description = "特別な能力は持たず、発言と投票で人狼を探します。"
difficulty = 1

[roles.werewolf]
identity_faction = "werewolf"
victory_team = "werewolf"
objective = "人狼の生存数を村側以上にします。"
abilities = ["night_attack", "pack_knowledge"]
label = "人狼"
description = "夜に襲撃し、昼は正体を隠して議論に参加します。"
difficulty = 2

[roles.seer]
identity_faction = "village"
victory_team = "village"
objective = "調査結果を活用して人狼を特定します。"
abilities = ["inspect"]
label = "占い師"
description = "夜にひとりを調べ、推理の手がかりを得ます。"
difficulty = 2

[roles.knight]
identity_faction = "village"
victory_team = "village"
objective = "重要な村陣営を襲撃から守ります。"
abilities = ["guard"]
label = "騎士"
description = "夜にひとりを守り、襲撃から救えることがあります。"
difficulty = 2

[roles.medium]
identity_faction = "village"
victory_team = "village"
objective = "処刑結果を手がかりに人狼を特定します。"
abilities = ["medium_knowledge"]
label = "霊媒師"
description = "処刑されたプレイヤーの正体を確認します。"
difficulty = 2

[roles.apothecary]
identity_faction = "village"
victory_team = "village"
objective = "限られた薬を使い、村陣営の生存を助けます。"
abilities = ["heal", "poison"]
label = "薬師"
description = "治療薬と毒薬をそれぞれ一度だけ使用できます。"
difficulty = 3

[roles.hunter]
identity_faction = "village"
victory_team = "village"
objective = "死亡時の反撃を村陣営の勝利につなげます。"
abilities = ["death_shot"]
label = "猟師"
description = "死亡時に生存者ひとりへ自動で反撃します。"
difficulty = 3

[roles.madman]
identity_faction = "village"
victory_team = "werewolf"
objective = "村人として判定されながら人狼陣営を勝利させます。"
abilities = []
label = "狂人"
description = "人狼を支援しますが、調査では村陣営として判定されます。"
difficulty = 3

[roles.fox]
identity_faction = "fox"
victory_team = "fox"
objective = "いずれかの通常陣営が勝利条件を満たすまで生存します。"
abilities = ["attack_immunity", "inspection_vulnerability"]
label = "妖狐"
description = "襲撃では死亡せず、占われると死亡します。"
difficulty = 3

[default_role_counts.5]
werewolf = 1
seer = 1
knight = 1
villager = 2

[default_role_counts.6]
werewolf = 1
seer = 1
knight = 1
villager = 3

[default_role_counts.7]
werewolf = 2
seer = 1
knight = 1
villager = 3

[default_role_counts.8]
werewolf = 2
seer = 1
knight = 1
villager = 4
