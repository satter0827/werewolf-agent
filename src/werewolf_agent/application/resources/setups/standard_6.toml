schema_version = "0.2.0"

[mechanics.role_counts]
werewolf = 1
seer = 1
knight = 1
villager = 3

[mechanics.roles.werewolf]
identity_faction = "werewolf"
victory_team = "werewolf"
abilities = ["night_attack", "pack_knowledge"]

[mechanics.roles.seer]
identity_faction = "village"
victory_team = "village"
abilities = ["inspect"]

[mechanics.roles.knight]
identity_faction = "village"
victory_team = "village"
abilities = ["guard"]

[mechanics.roles.villager]
identity_faction = "village"
victory_team = "village"
abilities = []

[mechanics.abilities.night_attack]
kind = "attack"
phase = "night"
target_policy = "other_alive_non_faction"
start_day = 1
max_uses = "unlimited"
result_visibility = "none"
resolution_priority = 100
allow_repeat_target = true
enabled_first_night = true
tie_resolution = "random_target"

[mechanics.abilities.pack_knowledge]
kind = "knowledge"
phase = "night"
target_policy = "none"
start_day = 1
max_uses = "unlimited"
result_visibility = "private"
resolution_priority = 10
allow_repeat_target = true
enabled_first_night = true
result_detail = "role"
knowledge_mode = "allies"

[mechanics.abilities.inspect]
kind = "inspect"
phase = "night"
target_policy = "other_alive"
start_day = 1
max_uses = "unlimited"
result_visibility = "private"
resolution_priority = 200
allow_repeat_target = true
enabled_first_night = true
result_detail = "faction"

[mechanics.abilities.guard]
kind = "protect"
phase = "night"
target_policy = "alive"
start_day = 1
max_uses = "unlimited"
result_visibility = "none"
resolution_priority = 50
allow_repeat_target = true
enabled_first_night = true

[mechanics.rules]
day_speech_limit_per_player = 1
allow_self_vote = false
allow_vote_revision = false
allow_night_action_revision = false
vote_tie_resolution = "no_elimination"
starting_phase = "night"
reveal_role_on_death = false
require_all_actions_before_advance = true

[theme]
id = "classic_village"
name = "古い村"
summary = "静かな村で、隠れた人狼を探します。"
premise = "舞台は小さな古い村です。参加者は発言と投票から隠れた人狼を探します。"
narration_enabled = true

[theme.role_names]
werewolf = "人狼"
seer = "占い師"
knight = "騎士"
villager = "村人"

[theme.role_objectives]
werewolf = "正体を隠して村人を減らし、人狼陣営を勝利させます。"
seer = "占い結果を推理に生かし、人狼を特定します。"
knight = "重要な村人を護衛し、村陣営の生存を助けます。"
villager = "発言と投票から人狼を見つけ、村陣営を勝利させます。"

[theme.role_descriptions]
werewolf = "夜に襲撃し、昼は正体を隠して議論します。"
seer = "夜にひとりを調べます。"
knight = "夜にひとりを襲撃から守ります。"
villager = "能力を持たず、発言と投票で推理します。"

[theme.faction_names]
village = "村陣営"
werewolf = "人狼陣営"

[theme.ability_names]
night_attack = "襲撃"
pack_knowledge = "仲間認識"
inspect = "占い"
guard = "護衛"

[theme.ability_descriptions]
night_attack = "夜に別陣営の生存者を襲撃します。"
pack_knowledge = "同じ陣営の仲間を知ります。"
inspect = "夜に生存者の陣営を調べます。"
guard = "夜に生存者を襲撃から守ります。"

[theme.action_names]
speech = "発言"
vote = "投票"
use_ability = "能力を使う"
pass = "見送る"

[theme.phase_names]
night = "夜"
day_discussion = "昼の議論"
voting = "投票"
finished = "終幕"

[theme.narration]
game_started = ["静かな村に参加者が集まり、疑念の夜が始まりました。"]
phase_started = ["次の時間へ進みます。"]
night_resolved = ["夜が明けました。残された事実が議論を動かします。"]
vote_resolved = ["投票の結果が示されました。"]
game_finished = ["すべての決着がつきました。"]

