[scenarios.classic_village]
label = "古い村"
summary = "静かな村で、隠れた人狼を探します。"
prompt_premise = "舞台は小さな古い村です。参加者は村の平穏を取り戻すため、公開発言と投票から隠れた人狼を探します。"
narration_profile = "classic"
recommended_setup_preset = "standard_6"
allowed_roles = ["villager", "werewolf", "seer", "knight"]

[scenarios.sealed_lab]
label = "閉鎖研究所"
summary = "隔離された研究所で、異変の原因を追います。"
prompt_premise = "舞台は外部と切り離された研究所です。参加者は限られた情報を照らし合わせ、異変を起こす存在を特定しようとします。"
narration_profile = "tense"
recommended_setup_preset = "standard_6"
allowed_roles = ["villager", "werewolf", "seer", "knight"]

[scenarios.starship]
label = "宇宙船"
summary = "航行中の船内で、仲間に紛れた脅威を探します。"
prompt_premise = "舞台は航行中の宇宙船です。参加者は船内ログと発言の矛盾を頼りに、仲間に紛れた脅威を探します。"
narration_profile = "tense"
recommended_setup_preset = "logic_6"
allowed_roles = ["villager", "werewolf", "seer", "knight"]

[narration_profiles.classic.events.game_started]
templates = ["静かな場に{player_count}人が集まり、疑念の夜が始まりました。"]

[narration_profiles.classic.events.phase_started]
templates = ["{phase_label}へ進みます。場の空気が少し変わりました。"]

[narration_profiles.classic.events.night_resolved]
templates = ["夜が明けました。残された事実だけが、次の議論を動かします。"]

[narration_profiles.classic.events.vote_resolved]
templates = ["投票がまとまり、場の判断がひとつの結果になりました。"]

[narration_profiles.classic.events.game_finished]
templates = ["最後の判断が下され、{winner_label}の勝利で幕を閉じました。"]

[narration_profiles.tense.events.game_started]
templates = ["閉ざされた場に{player_count}人が残され、最初の夜が始まりました。"]

[narration_profiles.tense.events.phase_started]
templates = ["{phase_label}に移ります。誰もが次の一言を測っています。"]

[narration_profiles.tense.events.night_resolved]
templates = ["夜が終わりました。沈黙の中に、次の手がかりが残されています。"]

[narration_profiles.tense.events.vote_resolved]
templates = ["投票の結果が示され、疑いの向きがはっきりしました。"]

[narration_profiles.tense.events.game_finished]
templates = ["全ての選択が積み重なり、{winner_label}の勝利が決まりました。"]

[setup_presets.standard_6]
label = "標準 6人"
scenario_id = "classic_village"

[setup_presets.standard_6.role_counts]
werewolf = 1
seer = 1
knight = 1
villager = 3

[setup_presets.logic_6]
label = "推理重視 6人"
scenario_id = "starship"

[setup_presets.logic_6.role_counts]
werewolf = 1
seer = 1
knight = 1
villager = 3
